<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حجز طاولة</title>
</head>
<body>

    <!-- شريط التنقل بين الصفحات -->
    <nav style="background-color: #f8f9fa; padding: 10px; margin-bottom: 20px;">
        <a href="/" style="margin-left: 15px;">الرئيسية</a>
        <a href="/menu" style="margin-left: 15px;">قائمة الطعام (المنيو)</a>
        <a href="/reserve">حجز طاولة</a>
    </nav>

    <h2>طلب حجز طاولة</h2>

    <!-- عرض رسالة التأكيد -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div style="color: green; background-color: #d4edda; border: 1px solid #c3e6cb; padding: 10px; margin-bottom: 15px; border-radius: 5px;">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- نموذج الحجز -->
    <form action="/reserve" method="POST">
        <label>الاسم:</label><br>
        <input type="text" name="name" required><br><br>
        
        <label>رقم الهاتف:</label><br>
        <input type="tel" name="phone" required><br><br>

        <label>تاريخ الحجز:</label><br>
        <input type="date" name="date" required><br><br>

        <label>الوقت:</label><br>
        <input type="time" name="time" required><br><br>

        <button type="submit">إرسال الطلب</button>
    </form>

</body>
</html>
