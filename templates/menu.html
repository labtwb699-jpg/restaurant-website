<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قائمة الطعام</title>
</head>
<body>

    <!-- شريط التنقل بين الصفحات -->
    <nav style="background-color: #f8f9fa; padding: 10px; margin-bottom: 20px;">
        <a href="/" style="margin-left: 15px;">الرئيسية</a>
        <a href="/menu" style="margin-left: 15px;">قائمة الطعام (المنيو)</a>
        <a href="/reserve">حجز طاولة</a>
    </nav>

    <h2>قائمة الطعام</h2>

    {% if items %}
        <ul>
        {% for item in items %}
            <li><strong>{{ item.name }}</strong> - {{ item.price }} جنيه</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>لا توجد وجبات مضافة حتى الآن. يمكنك إضافتها من لوحة التحكم (/admin).</p>
    {% endif %}

</body>
</html>
